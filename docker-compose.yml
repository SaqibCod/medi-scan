services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medi-scan-postgres
    environment:
      POSTGRES_DB: mediScan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - medi-scan_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediScan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  medi-scan_pg_data: