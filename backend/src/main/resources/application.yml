spring:
  application:
    name: medi-scan-backend

  # Everything here comes from the environment. No secrets in code or YAML.
  # See .env.example at the repo root for the full list.
  datasource:
    # 5433 matches docker-compose.yml, which avoids a natively installed Postgres
    # on 5432. Tests ignore this entirely - Testcontainers supplies its own URL.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/mediscan}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    # Flyway owns the schema. `validate` makes a drift between the entities and
    # the migrations fail at startup instead of Hibernate silently "fixing" it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    # The google-genai module, not vertex-ai-gemini: setting api-key selects the
    # Gemini Developer API (Google AI Studio), which needs no Google Cloud
    # project. See the dependency comment in pom.xml.
    #
    # When mediscan.llm.provider=fake, LlmProviderEnvironmentPostProcessor sets
    # spring.ai.model.chat=none so none of this is instantiated.
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
            # Both pipeline steps are transcription and summarisation of fixed
            # input, so there is nothing for sampling to improve.
            temperature: 0.0

  servlet:
    multipart:
      # Kept in step with mediscan.upload.max-bytes. Spring rejects an oversized
      # upload before the controller runs, which is why the advice maps
      # MaxUploadSizeExceededException to 413 FILE_TOO_LARGE (LLD 6.2). The
      # streaming byte count in TempFileStore enforces the same limit again, for
      # the case where a request arrives without a usable Content-Length.
      max-file-size: 10MB
      # Above max-file-size to leave room for the consent part and the headers.
      max-request-size: 11MB

server:
  # Caddy sets X-Forwarded-For in production. Without this, every rate-limit
  # bucket would key on the proxy's IP instead of the caller's (plan section 5).
  forward-headers-strategy: framework
  error:
    # Errors are rendered as RFC 9457 Problem Details by ApiExceptionHandler and
    # the security handlers, never by the servlet container's default page.
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        # Health only. Nothing else is exposed publicly (contract section 7).
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  pattern:
    # requestId comes from RequestIdFilter's MDC entry, so every log line can be
    # tied back to the X-Request-Id the client was given.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

mediscan:
  # Single allowed CORS origin, no wildcards (contract section 1.4).
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}
  session:
    # Guest sessions, and the reports they own, live this long (plan section 6).
    ttl-hours: ${RETENTION_HOURS:24}
  ratelimit:
    # Session creations per IP per hour (contract section 1.6).
    sessions-per-hour: ${RATE_LIMIT_SESSIONS_PER_HOUR:20}
    # Report creations per IP per hour (contract section 1.6).
    uploads-per-hour: ${RATE_LIMIT_UPLOADS_PER_HOUR:10}
  upload:
    # 10 MB, matching contract section 4.1 and the multipart limits below.
    max-bytes: 10485760
    # Also the cap on extracted text: beyond this a report fails
    # DOCUMENT_TOO_LONG rather than being sent to the model.
    max-text-chars: 50000
    min-text-chars: 20
    # Blank uses a medi-scan-uploads directory under the system temp directory.
    temp-dir: ${UPLOAD_TEMP_DIR:}
    # A temp file older than this was abandoned by a job that died, so the
    # retention sweep removes it (LLD 6.3).
    temp-file-max-age: 10m
  jobs:
    # 2 workers and a queue of 20 on a 2 GB box. A full queue is an honest
    # 429 BUSY, not an unbounded backlog (LLD 6.5).
    workers: 2
    queue-capacity: 20
    shutdown-grace: 10s
  extract:
    min-chars-per-page: 50
    min-total-chars: 100
    max-pages: 50
  llm:
    # `fake` is accepted only under the local and test profiles; see LlmProviderGuard.
    provider: ${LLM_PROVIDER:gemini}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
    timeout: 30s
    max-invalid-retries: 1
    max-transient-retries: 2
    daily-cap: ${GLOBAL_DAILY_LLM_CALLS:500}
    max-rows: 300
    max-summary-chars: 1500
    max-highlights: 20
  mask:
    # Off by default. The only English person model available is a 5 MB legacy
    # artefact trained on news text; the label rules are the real defence.
    # See SECURITY.md and LLD 19 item 4.
    opennlp-enabled: ${MASK_OPENNLP_ENABLED:false}
    opennlp-model: classpath:opennlp/en-ner-person.bin
    opennlp-min-probability: 0.7
    max-integrity-passes: 3
  retention:
    # dataflow 9.2 runs the cleanup every 15 minutes.
    interval-ms: 900000
    # Aggregated counters are kept for 90 days (plan section 7).
    stats-days: 90

---
spring:
  config:
    activate:
      on-profile: local

# Local only: health details help while developing. Production keeps `never`.
management:
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  level:
    dev.saq.mediscan: DEBUG
    org.flywaydb: INFO
