# Test profile. The datasource is supplied by PostgresTestBase's container.
mediscan:
  allowed-origin: http://localhost:3000
  session:
    ttl-hours: 24
  ratelimit:
    # Deliberately high so the shared in-memory buckets cannot run out part-way
    # through the suite and fail an unrelated test. SessionRateLimitTest and
    # UploadRateLimitTest lower these for themselves.
    sessions-per-hour: 1000
    uploads-per-hour: 1000
  llm:
    # No test ever reaches a real provider. FakeLlmProvider is scripted per test
    # (backend/CLAUDE.md, "Testing").
    provider: fake
    api-key: ""
    model: fake-model
    # Tests assert on retry counts, so these stay at the production defaults.
    timeout: 5s
  retention:
    interval-ms: 3600000
    user-report-days: 30
    inactive-account-days: 180
  auth:
    google:
      # Blank: Google sign-in is disabled by default, so a test that forgets to
      # stub the verifier gets a clean GOOGLE_TOKEN_INVALID rather than an
      # attempt to reach Google. Tests that exercise sign-in replace the
      # verifier's decoder with TestGoogleIssuer's (LLD 13.1).
      client-id: ""
    jwt:
      # Two keys on purpose, and the current one is not the first: it is the
      # only arrangement that catches a missing `kid` in the JWS header, which
      # a single-key ring signs silently (LLD 6.2, D10). These are fixed test
      # values and are not used anywhere else - production keys come from
      # JWT_SIGNING_KEYS and are never shared between environments.
      signing-keys: "test-k1:bWVkaS1zY2FuLXRlc3Qtc2lnbmluZy1rZXktbm8xISE=,test-k2:bWVkaS1zY2FuLXRlc3Qtc2lnbmluZy1rZXktbm8yISE="
      current-kid: test-k2

logging:
  level:
    # Quiet the container and migration noise; test failures should be readable.
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    org.flywaydb: WARN
