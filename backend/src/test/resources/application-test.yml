# Test profile. The datasource is supplied by PostgresTestBase's container.
mediscan:
  allowed-origin: http://localhost:3000
  session:
    ttl-hours: 24
  ratelimit:
    # Deliberately high so the shared in-memory buckets cannot run out part-way
    # through the suite and fail an unrelated test. SessionRateLimitTest and
    # UploadRateLimitTest lower these for themselves.
    sessions-per-hour: 1000
    uploads-per-hour: 1000
    # Same reason: the auth tests sign in dozens of times from 127.0.0.1 within a
    # minute, and the real limit of 10 would fail whichever test happened to run
    # eleventh. AuthRateLimitTest lowers it for itself.
    auth-per-minute: 1000
  llm:
    # No test ever reaches a real provider. FakeLlmProvider is scripted per test
    # (backend/CLAUDE.md, "Testing").
    provider: fake
    api-key: ""
    model: fake-model
    # Tests assert on retry counts, so these stay at the production defaults.
    timeout: 5s
  retention:
    interval-ms: 3600000
    user-report-days: 30
    inactive-account-days: 180
  auth:
    google:
      # Blank: Google sign-in is disabled by default, so a test that forgets to
      # stub the verifier gets a clean GOOGLE_TOKEN_INVALID rather than an
      # attempt to reach Google. Tests that exercise sign-in replace the
      # verifier's decoder with TestGoogleIssuer's (LLD 13.1).
      client-id: ""
    jwt:
      # Two keys on purpose, and the current one is not the first: it is the
      # only arrangement that catches a missing `kid` in the JWS header, which
      # a single-key ring signs silently (LLD 6.2, D10). These are fixed test
      # values and are not used anywhere else - production keys come from
      # JWT_SIGNING_KEYS and are never shared between environments.
      signing-keys: "test-k1:bWVkaS1zY2FuLXRlc3Qtc2lnbmluZy1rZXktbm8xISE=,test-k2:bWVkaS1zY2FuLXRlc3Qtc2lnbmluZy1rZXktbm8yISE="
      current-kid: test-k2
  chat:
    model: fake-model
    # High for the same reason as the limits above: the shared in-memory bucket
    # must not run out part-way through the suite. ChatRateLimitTest lowers it.
    rate-per-hour: 1000
    # Short, so a test asserting that pings appear does not wait 15 seconds for
    # one, and a test asserting the timeout does not wait a minute.
    ping-interval: 200ms
    stream-timeout: 10s
  embedding:
    # FakeEmbeddingModel stands in; no test reaches a real embedding API. The
    # width still has to match vector_store.embedding, because the vectors go
    # into the real column in a real Postgres.
    model: fake-embedding
    dimensions: 768
  rag:
    # Nothing in the test fixtures is reviewed, and an indexer that skipped
    # every page would make the retrieval tests vacuous.
    require-reviewed: false
    # Off: embedding takes from the daily cap, so a startup index would spend
    # budget that LlmGatewayTest and the capacity tests then measure.
    # ContentIndexerTest drives the indexer directly instead.
    index-on-startup: false

logging:
  level:
    # Quiet the container and migration noise; test failures should be readable.
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    org.flywaydb: WARN
