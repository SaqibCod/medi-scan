# The eval profile. Active alongside "test" (EvalRunner extends PostgresTestBase, which sets
# "test", and adds "eval" itself) - Spring Boot's last-wins rule for multiple active profiles
# means every key here overrides application-test.yml's fake-provider defaults, while anything
# not restated here (max-invalid-retries, max-transient-retries, max-rows, ...) still comes from
# the base application.yml, unchanged from production.
#
# LlmProviderGuard (production code, unmodified) already refuses to start with
# mediscan.llm.provider=gemini and a blank GEMINI_API_KEY, so EvalRunner needs no separate
# "refuse to run without a key" check of its own.
mediscan:
  llm:
    provider: gemini
    api-key: ${GEMINI_API_KEY:}
    # Cosmetic only: this is what LlmUsageLogger prints, not what the model call actually
    # uses. The real model comes from spring.ai.google.genai.chat.options.model in the base
    # application.yml, which this profile does not restate, so it inherits unchanged
    # (confirmed 2026-10-18 the hard way: overriding mediscan.llm.model alone silently did
    # nothing to the real request). Keep this in step with that value by hand.
    model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
    # Comfortably above eval.max-llm-calls (default 120, LLD 5.2) so the real cap guard is
    # never the thing that stops a run - that's eval.max-llm-calls's job, not this one's.
    daily-cap: 2000
    # Raised from the base application.yml's 30s (2026-10-19, eval profile only - production
    # stays at 30s). Originally added while chasing what turned out to be a different problem
    # (docs/phase-3-findings.md item 1: the timeouts were gemini-2.5-flash, which was silently
    # the model actually in use). Kept anyway, because the margin is genuinely thin once the
    # configured model is really the one being called: a pdf-lipid-table extract measured
    # 21.4s against gemini-3.8-flash, which leaves production's 30s only ~9s of headroom.
    # Worth revisiting for production on the strength of a full run's latency spread.
    timeout: 60s

spring:
  ai:
    retry:
      # Spring AI's own GoogleGenAiChatModel wraps every call in a RetryTemplate that is on by
      # default (spring.ai.retry.max-attempts defaults to 10, exponential backoff starting at
      # 2s x5 per attempt) and is completely invisible to LlmGateway and this eval's own
      # pacing/budget accounting - a single "attempt" logged by LlmUsageLogger can silently be
      # several real HTTP requests to Gemini, several multiples of what eval.delay-between-calls-ms
      # and eval.max-llm-calls think they are spending. Traced on gemini-2.5-flash (2026-10-17)
      # via 27-60s latencies on summary calls for both a large case (cmp-clean-table) and a
      # small one (comparators) - size-independent, which was the signature of a hidden retry
      # loop rather than slow generation. Setting this to 1 made LlmGateway's own
      # already-reviewed retry and backoff (mediscan.llm.max-transient-retries) the only retry
      # layer in effect.
      #
      # Then raised to 3 (2026-10-18) on the theory that 1 was too aggressive for the new
      # model. That theory was wrong, and the evidence for it was an artefact: the cases this
      # was meant to rescue were failing on a misconfiguration (docs/phase-3-findings.md item
      # 1), and the "direct calls succeed" comparison that seemed to implicate this setting
      # was really down to those scratch tests overriding the model per request. With the
      # root cause fixed, both previously-failing cases pass first time, no retries used.
      #
      # Left at 3 rather than reverted to the Spring AI default (10) because the eval's own
      # budget accounting cannot see this layer at all: one logged "attempt" may be several
      # real requests, which quietly multiplies both eval.max-llm-calls and the pacing below.
      # A small number keeps that distortion small while still leaving some cushion.
      max-attempts: 3

# eval.* properties, read directly with @Value in EvalRunner - these are test-only knobs, not
# part of the production configuration surface MediScanProperties covers.
eval:
  # LLD 5.2. The runner counts real (non-cached) calls and stops cleanly at this many.
  #
  # This account's free tier (checked at aistudio.google.com/rate-limit, approval point 2,
  # item 4) caps the Gemini Flash family at 20 requests/day - well under the ~56+ calls a full
  # 31-case run needs. 16 leaves a margin below that daily wall for calls already spent earlier
  # the same day; the disk cache means a run that stops here picks back up for free once the
  # quota resets, so completing the dataset is a multi-day exercise on this tier, not a bug to
  # work around.
  max-llm-calls: 16
  # LLD 5.1. The same account page gives 5 requests/minute for the Gemini Flash family - the
  # earlier 6000ms guess (10 RPM) was double that and is almost certainly why calls were failing
  # with increasingly severe errors. 13000ms paces at a little under 5/minute, with margin.
  delay-between-calls-ms: 13000
  # LLD 5.3. False ignores nothing; set true to force every case to call the model again.
  refresh-cache: false
